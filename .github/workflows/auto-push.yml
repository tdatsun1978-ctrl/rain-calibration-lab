name: Auto Push Artifacts
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auto_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add new generated files
        run: |
          git config user.name "R.A.I.N. Automation"
          git config user.email "rain@system.local"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated file sync by R.A.I.N."
      
      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
